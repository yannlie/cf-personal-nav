<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="自建站点导航：分组卡片、搜索别名、书签导入导出。">
  <title>我的导航</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-density="compact">
  <header class="nav">
    <a class="brand" href="#">
      <span class="brand-mark">导</span>
      <span id="nav-brand-text">我的导航</span>
    </a>
    <div class="nav-actions">
      <button class="user-name hidden" id="user-name" type="button" title="账号设置"></button>
      <button id="density-btn" class="icon-btn hidden" aria-label="切换卡片密度" title="切换卡片密度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
      </button>
      <button id="data-btn" class="icon-btn hidden" aria-label="导入导出" title="导入导出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <path d="m7 10 5 5 5-5"></path>
          <path d="M12 15V3"></path>
        </svg>
      </button>
      <button id="theme-btn" class="icon-btn" aria-label="切换深浅色模式" title="切换深浅色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
      <button id="edit-btn" class="icon-btn hidden" aria-label="编辑站点" title="编辑站点">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
          <path d="m15 5 4 4"></path>
        </svg>
      </button>
      <button id="logout-btn" class="icon-btn hidden" aria-label="退出登录" title="退出登录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="m16 17 5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section id="auth-view" class="auth-view">
      <div class="auth-panel">
        <div class="auth-head">
          <span class="auth-mark">导</span>
          <h1>我的导航</h1>
        </div>
        <div class="segmented" role="tablist" aria-label="登录注册">
          <button id="tab-login" class="active" type="button" data-tab="login">登录</button>
          <button id="tab-register" type="button" data-tab="register">注册</button>
        </div>
        <form id="auth-form" autocomplete="on">
          <label for="username">用户名</label>
          <input id="username" name="username" maxlength="32" required>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" minlength="8" maxlength="128" required>
          <label for="register-key" class="hidden" id="key-label">注册码</label>
          <input id="register-key" class="hidden" type="password" maxlength="128">
          <button id="auth-submit" class="primary-btn" type="submit">登录</button>
        </form>
        <p id="auth-error" class="auth-error" role="alert"></p>
      </div>
    </section>

    <section id="app-view" class="hidden">
      <div class="hero">
        <h1 id="hero-title">我的导航</h1>
        <p id="hero-subtitle">自建站点，一处直达</p>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input id="search" type="search" placeholder="搜索站点，或输入 !g 关键词" autocomplete="off" spellcheck="false">
          <kbd class="search-kbd">/</kbd>
        </div>
        <p id="search-hint" class="search-hint hidden"></p>
      </div>

      <div id="groups"></div>
      <div id="onboarding" class="onboarding hidden"></div>
    </section>

    <section id="editor-view" class="editor-view hidden">
      <div class="editor-head">
        <h2>编辑站点</h2>
        <div class="editor-actions">
          <button id="add-btn" class="secondary-btn" type="button">添加站点</button>
          <button id="cancel-btn" class="secondary-btn" type="button">取消</button>
          <button id="save-btn" class="primary-btn" type="button">保存</button>
        </div>
      </div>

      <div class="editor-settings">
        <div class="field">
          <label for="settings-title">导航名称</label>
          <input id="settings-title" maxlength="50">
        </div>
        <div class="field">
          <label for="settings-subtitle">副标题</label>
          <input id="settings-subtitle" maxlength="100">
        </div>
      </div>

      <p class="editor-tip">拖着左侧手柄可以调整顺序，把站点拖到别的分组里就会改到那个分组；分组名可直接改名，输入新名称即可新建分组。</p>

      <div id="editor-groups"></div>
      <p id="editor-empty" class="empty hidden">还没有站点，点「添加站点」开始。</p>
    </section>
  </main>

  <footer id="footer" class="hidden">
    <div class="footer-links">
      <a href="https://github.com/yannlie" target="_blank" rel="noopener noreferrer">GitHub 主页</a>
      <a href="https://github.com/yannlie/cf-personal-nav" target="_blank" rel="noopener noreferrer">本项目仓库</a>
    </div>
    <p id="footer-text">© 2026 我的导航</p>
  </footer>

  <div id="toast" class="toast hidden" role="status"></div>
  <div id="context-menu" class="context-menu hidden" role="menu"></div>
  <input id="file-input" type="file" class="hidden-file" tabindex="-1" aria-hidden="true">
  <script type="module" src="/js/app.js"></script>
</body>
</html>
